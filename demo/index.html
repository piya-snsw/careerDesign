<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FE Exam Speed Quiz - 基本情報技術者試験</title>
    <!-- Load React and Babel via CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Quiz Data -->
    <script src="questions_technology.js"></script>
    <script src="questions_management.js"></script>
    <script src="questions_strategy.js"></script>
    <script>
        // Aggregate all questions from category files
        const QUESTIONS = [
            ...TECH_QUESTIONS,
            ...MGMT_QUESTIONS,
            ...STRAT_QUESTIONS
        ];
    </script>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Noto+Sans+JP:wght@400;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --primary: #0284c7;
            /* Sky Blue */
            --primary-light: #38bdf8;
            --secondary: #0d9488;
            /* Teal */
            --bg: #f0f9ff;
            --card-bg: #ffffff;
            --glass: rgba(255, 255, 255, 0.7);
            --glass-border: rgba(2, 132, 199, 0.1);
            --text: #0f172a;
            --text-dim: #475569;
            --success: #10b981;
            --error: #f43f5e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', 'Noto Sans JP', sans-serif;
            background-color: var(--bg);
            background-image:
                radial-gradient(at 0% 0%, hsla(199, 89%, 95%, 1) 0, transparent 50%),
                radial-gradient(at 100% 100%, hsla(187, 89%, 95%, 1) 0, transparent 50%);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
        }

        #root {
            width: 100%;
            max-width: 800px;
            padding: 1.5rem;
            z-index: 1;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 2.5rem;
            box-shadow: 0 10px 15px -3px rgba(2, 132, 199, 0.05), 0 4px 6px -2px rgba(2, 132, 199, 0.02);
            animation: fadeIn 0.5s ease-out;
            text-align: center;
        }

        h1 {
            font-size: 2.25rem;
            font-weight: 800;
            margin-bottom: 1rem;
            color: var(--primary);
            letter-spacing: -0.02em;
        }

        .category-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 1rem;
            margin-top: 1.5rem;
        }

        .btn {
            background: white;
            border: 1px solid #e2e8f0;
            color: var(--text);
            padding: 1rem 1.25rem;
            border-radius: 14px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 600;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .btn:hover:not(:disabled) {
            border-color: var(--primary-light);
            background: #f0f9ff;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.1);
        }

        .btn.primary {
            background: var(--primary);
            color: white;
            border: 1px solid var(--primary);
        }

        .btn.primary:hover:not(:disabled) {
            background: var(--primary-light);
            box-shadow: 0 6px 15px rgba(2, 132, 199, 0.2);
        }

        .btn.outline {
            background: transparent;
            border: 2px solid var(--primary);
            color: var(--primary);
        }

        .btn.outline:hover:not(:disabled) {
            background: var(--primary);
            color: white;
        }

        .btn:disabled {
            background: #e2e8f0;
            color: #94a3b8;
            cursor: not-allowed;
            border-color: #e2e8f0;
            transform: none !important;
            box-shadow: none !important;
        }

        .settings-area {
            margin: 2rem 0;
            padding: 1.5rem;
            background: #f8fafc;
            border-radius: 16px;
            text-align: left;
        }

        .settings-area label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 700;
            font-size: 0.9rem;
            color: var(--text-dim);
        }

        .settings-input-group {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .settings-input-group input[type="range"] {
            flex: 1;
            accent-color: var(--primary);
        }

        .count-display {
            font-weight: 800;
            font-size: 1.1rem;
            color: var(--primary);
            min-width: 3rem;
            text-align: right;
        }

        /* Toggle Switch Styles */
        .switch-group {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 1rem;
            padding: 0.75rem 0;
            border-top: 1px solid #e2e8f0;
        }

        .switch-label {
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--text-dim);
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 26px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #cbd5e1;
            transition: .4s;
            border-radius: 34px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked+.slider {
            background-color: var(--primary);
        }

        input:checked+.slider:before {
            transform: translateX(24px);
        }

        /* Countdown Styles */
        .countdown-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .countdown-number {
            font-size: 10rem;
            font-weight: 800;
            color: var(--primary);
            animation: zoomInOut 1s ease-in-out infinite;
        }

        @keyframes zoomInOut {
            0% {
                transform: scale(0.5);
                opacity: 0;
            }

            50% {
                transform: scale(1.2);
                opacity: 1;
            }

            100% {
                transform: scale(1);
                opacity: 0;
            }
        }

        .timer-container {
            width: 100%;
            height: 8px;
            background: #e0f2fe;
            border-radius: 4px;
            margin-bottom: 2rem;
            overflow: hidden;
        }

        .timer-bar {
            height: 100%;
            background: linear-gradient(to right, #f87171, #facc15, #4ade80);
            transition: width 0.1s linear;
        }

        .question-text {
            font-size: 1.2rem;
            text-align: left;
            margin-bottom: 2rem;
            line-height: 1.7;
            font-weight: 700;
            color: var(--text);
        }

        .choice-btn {
            display: block;
            width: 100%;
            text-align: left;
            margin-bottom: 0.8rem;
            background: #f8fafc;
            border: 2px solid #e2e8f0;
            padding: 1.1rem 1.5rem;
            border-radius: 16px;
            color: var(--text);
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'Noto Sans JP', sans-serif;
            font-size: 1rem;
        }

        .choice-btn:hover:not(:disabled) {
            background: white;
            border-color: var(--primary);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
        }

        .choice-btn.correct {
            background: #ecfdf5 !important;
            border-color: var(--success) !important;
            color: #065f46 !important;
        }

        .choice-btn.wrong {
            background: #fff1f2 !important;
            border-color: var(--error) !important;
            color: #9f1239 !important;
            animation: shake 0.4s ease-in-out;
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-4px);
            }

            75% {
                transform: translateX(4px);
            }
        }

        .score-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.75rem;
            font-weight: 700;
            color: var(--text-dim);
            font-size: 0.9rem;
        }

        .streak-badge {
            padding: 0.25rem 0.8rem;
            background: var(--secondary);
            border-radius: 20px;
            color: white;
            font-size: 0.75rem;
            animation: bounce 0.5s ease;
        }

        @keyframes bounce {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.15);
            }
        }

        .result-score {
            font-size: 4.5rem;
            font-weight: 800;
            margin: 1rem 0;
            color: var(--primary);
        }

        .category-label {
            position: absolute;
            top: 1.5rem;
            left: 2rem;
            font-size: 0.7rem;
            color: var(--text-dim);
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        .explanation-box {
            margin-top: 1rem;
            padding: 1rem;
            background: #f0f9ff;
            border-left: 4px solid var(--primary);
            font-size: 0.9rem;
            text-align: left;
            color: var(--text-dim);
            line-height: 1.6;
            animation: fadeIn 0.3s ease;
        }

        .review-item {
            margin-bottom: 2rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid #f1f5f9;
            text-align: left;
        }

        .review-q {
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .action-group {
            display: flex;
            gap: 1rem;
            margin-bottom: 3rem;
        }

        .action-group .btn {
            flex: 1;
        }

        @media (max-width: 600px) {
            .card {
                padding: 1.5rem;
            }

            h1 {
                font-size: 1.75rem;
            }

            .action-group {
                flex-direction: column;
            }
        }

        .link-text {
            color: var(--primary);
            cursor: pointer;
            text-decoration: underline;
            transition: opacity 0.2s;
        }

        .link-text:hover {
            opacity: 0.7;
        }
    </style>
</head>

<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const CATEGORIES = ["テクノロジ", "マネジメント", "ストラテジ"];

        // --- Main App ---

        function App() {
            const [screen, setScreen] = useState('home');
            const [maxCount, setMaxCount] = useState(10);
            const [quizSet, setQuizSet] = useState([]);
            const [selectedCategories, setSelectedCategories] = useState(CATEGORIES);
            const [score, setScore] = useState(0);
            const [maxStreak, setMaxStreak] = useState(0);
            const [history, setHistory] = useState([]);

            const [isPracticeMode, setIsPracticeMode] = useState(false);

            const startQuiz = (cats, count) => {
                if (typeof QUESTIONS === 'undefined') {
                    alert("問題データの読み込みに失敗しました。questions.jsが正しく配置されているか確認してください。");
                    return;
                }

                const filtered = QUESTIONS.filter(q =>
                    cats.includes(q.category)
                ).sort(() => Math.random() - 0.5);

                if (filtered.length === 0) {
                    alert("選択された条件に一致する問題が見つかりませんでした。");
                    return;
                }

                const finalSet = filtered.slice(0, Math.min(count, filtered.length));

                setQuizSet(finalSet);
                setSelectedCategories(cats);
                setMaxCount(count);
                setScore(0);
                setMaxStreak(0);
                setHistory([]);
                setScreen(isPracticeMode ? 'quiz' : 'countdown');
            };

            const finishQuiz = (finalScore, finalHistory, finalMaxStreak) => {
                setScore(finalScore);
                setHistory(finalHistory);
                setMaxStreak(finalMaxStreak);
                setScreen('result');
            };

            const retryQuiz = () => {
                startQuiz(selectedCategories, maxCount);
            };

            return (
                <div>
                    {screen === 'home' && (
                        <Home
                            onStart={startQuiz}
                            categories={CATEGORIES}
                            isPracticeMode={isPracticeMode}
                            setIsPracticeMode={setIsPracticeMode}
                        />
                    )}
                    {screen === 'countdown' && (
                        <Countdown onFinish={() => setScreen('quiz')} />
                    )}
                    {screen === 'quiz' && (
                        <Quiz
                            questions={quizSet}
                            onFinish={finishQuiz}
                            categories={selectedCategories}
                            isPracticeMode={isPracticeMode}
                        />
                    )}
                    {screen === 'result' && (
                        <Result
                            score={score}
                            streak={maxStreak}
                            history={history}
                            onRetry={retryQuiz}
                            onHome={() => setScreen('home')}
                            isPracticeMode={isPracticeMode}
                        />
                    )}
                </div>
            );
        }

        // --- Components ---

        function Home({ onStart, categories, isPracticeMode, setIsPracticeMode }) {
            const [questionCount, setQuestionCount] = useState(10);
            const [localSelectedCats, setLocalSelectedCats] = useState(categories);

            const toggleCategory = (cat) => {
                setLocalSelectedCats(prev =>
                    prev.includes(cat)
                        ? prev.filter(c => c !== cat)
                        : [...prev, cat]
                );
            };

            return (
                <div className="card">
                    <div style={{ fontSize: '0.8rem', color: 'var(--primary)', fontWeight: 'bold', marginBottom: '0.5rem' }}>Fundamental Information Technology Engineer</div>
                    <h1>FE Speed Quiz</h1>
                    <p style={{ color: 'var(--text-dim)', marginBottom: '1.5rem', lineHeight: '1.6' }}>
                        知識を最速でアウトプットせよ。<br />
                        回答時間と連続正解数でスコアがアップします。
                    </p>

                    <div className="settings-area">
                        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                            <label>分野の選択 (複数選択可)</label>
                            <div style={{ fontSize: '0.8rem' }}>
                                <span className="link-text" onClick={() => setLocalSelectedCats(categories)}>全選択</span>
                                <span style={{ margin: '0 0.5rem', color: '#ccc' }}>|</span>
                                <span className="link-text" onClick={() => setLocalSelectedCats([])}>全解除</span>
                            </div>
                        </div>
                        <div className="category-grid" style={{ marginBottom: '1.5rem', marginTop: '0.5rem' }}>
                            {categories.map(cat => (
                                <button
                                    key={cat}
                                    className={`btn ${localSelectedCats.includes(cat) ? 'primary' : ''}`}
                                    onClick={() => toggleCategory(cat)}
                                >
                                    {cat}
                                </button>
                            ))}
                        </div>

                        <div style={{ display: 'none' }}>
                            {/* Year selection removed */}
                        </div>

                        <label>問題数設定 (10 - 100問)</label>
                        <div className="settings-input-group">
                            <input
                                type="range"
                                min="10"
                                max="100"
                                step="10"
                                value={questionCount}
                                onChange={(e) => setQuestionCount(parseInt(e.target.value))}
                            />
                            <div className="count-display">{questionCount}</div>
                        </div>

                        <div className="switch-group">
                            <span className="switch-label">練習モード (制限時間なし)</span>
                            <label className="switch">
                                <input
                                    type="checkbox"
                                    checked={isPracticeMode}
                                    onChange={(e) => setIsPracticeMode(e.target.checked)}
                                />
                                <span className="slider"></span>
                            </label>
                        </div>
                    </div>

                    <button
                        className="btn primary"
                        style={{ width: '100%', padding: '1.25rem', fontSize: '1.1rem' }}
                        disabled={localSelectedCats.length === 0}
                        onClick={() => onStart(localSelectedCats, questionCount)}
                    >
                        {localSelectedCats.length === 0
                            ? "分野を選択してください"
                            : "クイズをスタート"
                        }
                    </button>
                </div>
            );
        }

        function Countdown({ onFinish }) {
            const [count, setCount] = useState(3);

            useEffect(() => {
                if (count > 0) {
                    const timer = setTimeout(() => setCount(count - 1), 1000);
                    return () => clearTimeout(timer);
                } else {
                    const timer = setTimeout(onFinish, 500);
                    return () => clearTimeout(timer);
                }
            }, [count]);

            return (
                <div className="countdown-overlay">
                    <div className="countdown-number" key={count}>
                        {count > 0 ? count : 'START!'}
                    </div>
                </div>
            );
        }

        function Quiz({ questions, onFinish, categories, isPracticeMode }) {
            const [currentIndex, setCurrentIndex] = useState(0);
            const [score, setScore] = useState(0);
            const [streak, setStreak] = useState(0);
            const [maxStreak, setMaxStreak] = useState(0);
            const [timeLeft, setTimeLeft] = useState(10);
            const [answered, setAnswered] = useState(false);
            const [selectedIdx, setSelectedIdx] = useState(null);
            const [history, setHistory] = useState([]);

            const [currentPoints, setCurrentPoints] = useState(0);

            const timerRef = useRef(null);

            const currentQuestion = questions[currentIndex];

            if (!currentQuestion) {
                return (
                    <div className="card">
                        <p>問題の読み込み中にエラーが発生しました。</p>
                        <button className="btn primary" onClick={() => onFinish(0, [], 0)}>ホームに戻る</button>
                    </div>
                );
            }

            useEffect(() => {
                if (!answered && !isPracticeMode) {
                    timerRef.current = setInterval(() => {
                        setTimeLeft(prev => {
                            if (prev <= 0.1) {
                                handleAnswer(null);
                                return 0;
                            }
                            return prev - 0.1;
                        });
                    }, 100);
                }
                return () => clearInterval(timerRef.current);
            }, [currentIndex, answered, isPracticeMode]);

            const handleAnswer = (idx) => {
                if (answered) return;
                clearInterval(timerRef.current);
                setAnswered(true);
                setSelectedIdx(idx);

                const isCorrect = idx === currentQuestion.answer;
                let points = 0;
                let newStreak = streak;

                if (!isPracticeMode && isCorrect) {
                    newStreak += 1;
                    const speedMultiplier = Math.max(0.2, timeLeft / 10);
                    points = Math.floor(1000 * speedMultiplier) + (newStreak - 1) * 100;
                    setScore(prev => prev + points);
                    setStreak(newStreak);
                    if (newStreak > maxStreak) setMaxStreak(newStreak);
                } else if (!isPracticeMode) {
                    newStreak = 0;
                    setStreak(0);
                    // 不正解の場合は減点（時間切れは0点、間違えたら-300点、ただし0未満にはならない）
                    if (idx !== null) {
                        const penalty = 300;
                        points = -penalty;
                        setScore(prev => Math.max(0, prev - penalty));
                    }
                }
                setCurrentPoints(points);

                if (!isPracticeMode) {
                    setTimeout(() => {
                        goToNextQuestion(isCorrect, points, newStreak, idx);
                    }, 1500);
                }
            };

            const goToNextQuestion = (isCorrectArg, pointsArg, streakArg, userIdx) => {
                const newHistoryItem = {
                    question: currentQuestion.text,
                    isCorrect: isCorrectArg,
                    userAnswer: userIdx !== null ? currentQuestion.choices[userIdx] : (isPracticeMode ? "未回答" : "時間切れ"),
                    correctAnswer: currentQuestion.choices[currentQuestion.answer],
                    explanation: currentQuestion.explanation,
                    source: currentQuestion.source
                };

                const updatedHistory = [...history, newHistoryItem];

                if (currentIndex + 1 < questions.length) {
                    setHistory(updatedHistory);
                    setCurrentIndex(prev => prev + 1);
                    setTimeLeft(10);
                    setAnswered(false);
                    setSelectedIdx(null);
                    setCurrentPoints(0);
                } else {
                    // Calculate final score correctly
                    onFinish(score + pointsArg, updatedHistory, Math.max(maxStreak, streakArg));
                }
            };

            return (
                <div className="card" style={{ position: 'relative' }}>
                    <div className="category-label">
                        {categories.length === CATEGORIES.length ? "すべての分野" : categories.join(", ")} | {currentIndex + 1} / {questions.length}
                    </div>

                    <div style={{ marginTop: '1rem' }}>
                        <div className="score-info">
                            <span style={{ color: 'var(--primary)' }}>
                                {!isPracticeMode && `${score.toLocaleString()} PTS`}
                            </span>
                            <span>
                                {!isPracticeMode && streak > 1 && <span className="streak-badge">{streak} COMBO!</span>}
                            </span>
                        </div>
                        {!isPracticeMode && (
                            <div className="timer-container">
                                <div className="timer-bar" style={{
                                    width: `${(timeLeft / 10) * 100}%`
                                }}></div>
                            </div>
                        )}
                        <div className="question-text">
                            {currentQuestion.text}
                        </div>
                        <div className="choices-list">
                            {currentQuestion.choices.map((choice, i) => {
                                let className = "choice-btn";
                                if (answered) {
                                    if (i === currentQuestion.answer) className += " correct";
                                    else if (i === selectedIdx) className += " wrong";
                                }
                                return (
                                    <button
                                        key={i}
                                        className={className}
                                        onClick={() => handleAnswer(i)}
                                        disabled={answered}
                                    >
                                        <span style={{ fontWeight: 800, marginRight: '1rem', color: 'var(--primary-light)' }}>
                                            {['ア', 'イ', 'ウ', 'エ'][i]}
                                        </span>
                                        {choice}
                                    </button>
                                );
                            })}
                        </div>

                        {answered && (
                            <div style={{ marginTop: '1.5rem' }}>
                                <div className="explanation-box" style={{ whiteSpace: 'pre-wrap' }}>
                                    <strong>解説:</strong><br />
                                    {currentQuestion.explanation}
                                </div>
                                {isPracticeMode && (
                                    <button
                                        className="btn primary"
                                        style={{ width: '100%', marginTop: '1rem', padding: '1.25rem' }}
                                        onClick={() => {
                                            const isCorrect = selectedIdx === currentQuestion.answer;
                                            goToNextQuestion(isCorrect, 0, 0);
                                        }}
                                    >
                                        次の問題へ
                                    </button>
                                )}
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        function Result({ score, streak, history, onRetry, onHome, isPracticeMode }) {
            const correctCount = history.filter(h => h.isCorrect).length;
            const accuracy = Math.round((correctCount / history.length) * 100);

            return (
                <div className="card">
                    <h2 style={{ fontSize: '1.1rem', color: 'var(--text-dim)' }}>
                        {isPracticeMode ? "練習完了" : "リザルト"}
                    </h2>
                    {!isPracticeMode && <div className="result-score">{score.toLocaleString()}</div>}
                    <div style={{ display: 'flex', justifyContent: 'center', gap: '2rem', marginBottom: '2.5rem', marginTop: isPracticeMode ? '1.5rem' : '0' }}>
                        <div>
                            <div style={{ fontSize: '0.8rem', color: 'var(--text-dim)' }}>正解率</div>
                            <div style={{ fontWeight: 800, fontSize: '1.2rem' }}>{accuracy}%</div>
                        </div>
                        <div>
                            <div style={{ fontSize: '0.8rem', color: 'var(--text-dim)' }}>正解数</div>
                            <div style={{ fontWeight: 800, fontSize: '1.2rem' }}>{correctCount} / {history.length}</div>
                        </div>
                        {!isPracticeMode && (
                            <div>
                                <div style={{ fontSize: '0.8rem', color: 'var(--text-dim)' }}>MAXコンボ</div>
                                <div style={{ fontWeight: 800, fontSize: '1.2rem' }}>{streak}</div>
                            </div>
                        )}
                    </div>

                    <div className="action-group">
                        <button className="btn outline" onClick={onRetry}>もう一度挑戦</button>
                        <button className="btn primary" onClick={onHome}>ホームに戻る</button>
                    </div>

                    <div style={{ marginTop: '1rem' }}>
                        <h3 style={{ marginBottom: '2rem', fontSize: '1.4rem', borderBottom: '2px solid var(--primary)', display: 'inline-block', paddingBottom: '0.5rem' }}>
                            復習
                        </h3>
                        {history.map((h, i) => (
                            <div key={i} className="review-item">
                                <div style={{ marginBottom: '0.5rem', display: 'flex', alignItems: 'center', gap: '10px' }}>
                                    <span style={{
                                        padding: '4px 10px',
                                        borderRadius: '8px',
                                        fontSize: '0.75rem',
                                        background: h.isCorrect ? '#ecfdf5' : '#fff1f2',
                                        color: h.isCorrect ? 'var(--success)' : 'var(--error)',
                                        fontWeight: 800,
                                        border: `1px solid ${h.isCorrect ? '#d1fae5' : '#ffe4e6'}`
                                    }}>
                                        問 {i + 1} {h.isCorrect ? '正解' : '不正解'}
                                    </span>
                                    <span style={{ fontSize: '0.7rem', color: 'var(--text-dim)' }}>{h.source}</span>
                                </div>
                                <div className="review-q">{h.question}</div>
                                <div style={{ fontSize: '0.9rem', marginBottom: '0.8rem' }}>
                                    <span style={{ color: 'var(--text-dim)' }}>あなたの回答: </span>
                                    <span style={{ color: h.isCorrect ? 'var(--success)' : 'var(--error)', fontWeight: 700 }}>{h.userAnswer}</span>
                                    {!h.isCorrect && (
                                        <div style={{ color: 'var(--success)', fontWeight: 700, marginTop: '4px' }}>
                                            正解: {h.correctAnswer}
                                        </div>
                                    )}
                                </div>
                                <div className="explanation-box" style={{ background: '#f8fafc', border: 'none', borderRadius: '12px', whiteSpace: 'pre-wrap' }}>
                                    {h.explanation}
                                </div>
                            </div>
                        ))}
                    </div>

                    <div className="action-group" style={{ marginTop: '2rem' }}>
                        <button className="btn outline" onClick={onRetry}>もう一度挑戦</button>
                        <button className="btn primary" onClick={onHome}>ホームに戻る</button>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
